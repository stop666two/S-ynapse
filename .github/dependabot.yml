version: 2

# 工作流里的 `uses:` 全部锁到 40 位 commit SHA（尾部保留版本注释），
# 由本文件按周提出升级 PR。仓库对 npm 依赖已精确锁版本，action 是唯一可变上游引用——
# 一旦上游重指 v4，就能在带 contents: write 的发布 job 里执行任意代码。
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

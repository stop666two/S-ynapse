name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for AGENTS.md in changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            RANGE="$EMPTY_TREE..${{ github.sha }}"
          fi
          echo "Diff range: $RANGE"
          CHANGED=$(git diff --name-only "$RANGE" || git show --name-only --format= "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"
          echo "$CHANGED" | grep -qiE '(AGENTS\.md|AGENTS\.txt|AGENT\.md|AGENT\.txt|agent-readme\.md|RULES\.md)' && { echo "ERROR: AI rule files detected in changes. Blocking merge."; exit 1; } || echo "OK: No AI rule files detected."

  build:
    needs: check-agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check (tsc checkJs, scripts/lib)
        run: npm run typecheck
      - run: npm test
      - name: Config consistency (code defaults vs config files)
        run: npm run verify:config
      - name: Security verification (malicious-content build regression)
        run: npm run verify:security
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "CF_API_TOKEN not configured, skipping deploy"
            exit 0
          fi
          npx wrangler pages deploy dist --project-name=s-ynapse

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同一 ref 只保留一条流水线：此前连推两次 main 会并行跑完整门禁并各发一次 Pages，
# 后完成的旧提交可能覆盖新提交的产物。PR 用取消旧跑省额度；main 不取消（正在发版时不打断）。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --omit=dev --ignore-scripts
      - name: Decide whether to skip this run
        id: decide
        # 提交信息与事件字段一律经 env 传入再引用。直接内插 ${{ }} 到 run: 脚本里
        # 等于让 PR 标题/正文（squash 合入后即提交信息）经 bash 解析执行——外部贡献者可控。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: >-
          node scripts/ci-skip.js --workflow deploy.yml --head "$HEAD_SHA"
          --event "$EVENT_NAME"
          --commit-message "$COMMIT_MESSAGE"

  check-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for AGENTS.md in changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            RANGE="$EMPTY_TREE..${{ github.sha }}"
          fi
          echo "Diff range: $RANGE"
          CHANGED=$(git diff --name-only "$RANGE" || git show --name-only --format= "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"
          echo "$CHANGED" | grep -qiE '(AGENTS\.md|AGENTS\.txt|AGENT\.md|AGENT\.txt|agent-readme\.md|RULES\.md)' && { echo "ERROR: AI rule files detected in changes. Blocking merge."; exit 1; } || echo "OK: No AI rule files detected."

  compat-node22:
    needs: [check-agents, preflight]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 与 build/nightly 同口径显式声明：该 job 会跑全套 npm test 与一次构建。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'
          cache: 'npm'
      - run: npm ci
      - name: Tests (Node 22 LTS floor)
        run: npm test
      - name: Smoke build + installable app (Node 20 LTS floor)
        run: |
          npm run verify:config
          npm run verify:config-refs
          npm run verify:config-single-source
          npm run verify:config-dupes
          npm run verify:internals
          npm run test:build
          npm run build

  windows-compat:
    # 只能在 Windows 暴露的一类缺陷在 Linux CI 上完全不可见（仓库主要在本机 Windows 上开发）：
    # 大小写不敏感文件系统（slug `Tags` 与生成的 `tags/` 目录互相覆盖，构建仍报成功）、
    # 反斜杠路径、保留设备名（con/prn/aux/nul）。同等命令在 windows-latest 上再跑一遍。
    # 先 build 再 test，并显式开启性能契约严格模式 —— 让 9 条契约在 Windows 产物上也真的执行。
    needs: [check-agents, preflight]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Build (Windows path handling)
        run: npm run build
      - name: Tests (Windows filesystem semantics, perf contracts strict)
        env:
          PERF_CONTRACT_REQUIRE_DIST: '1'
        run: npm test

  build:
    needs: [check-agents, preflight, windows-compat]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 本 job 跑聚合门禁（24 项 × internals.ci.checkTimeoutMs = 600000ms），
    # 最坏预算 240min + 30min 缓冲 = 270min；此前的 260min 会先于预算触顶。
    # 显式声明与 nightly 同口径，verify:internals 会按项数反算断言。
    timeout-minutes: 300
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Export internals to environment (SYNAPSE_OUT_DIR / PAGES_PROJECT / NODE_VERSION …)
        run: node scripts/ci-env.js
      - name: Full quality suite (aggregate, no early abort; report at build-artifacts/ci-checks.*)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-checks.js
      - name: Upload CI report (always)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-checks
          path: build-artifacts/ci-checks.*
          if-no-files-found: error
      - name: Upload test artifacts (fuzz failures / web coverage / smoke / SBOM)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-artifacts
          path: build-artifacts/**
          if-no-files-found: ignore
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "CF_API_TOKEN not configured, skipping deploy"
            exit 0
          fi
          # Pages 只有构建期 _headers 的静态安全头，没有限流/路径拦截/维护模式/
          # HTTPS 跳转（见 docs/architecture.md §1.1）。生产域必须指向 Worker，Pages 仅预览。
          echo "NOTE: deploying to Cloudflare Pages (project: s-ynapse) — no rate limiting, path blocking, maintenance mode or HTTPS redirect on this surface."
          npm run deploy:pages

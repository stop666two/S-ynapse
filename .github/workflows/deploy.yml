name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --omit=dev --ignore-scripts
      - name: Decide whether to skip this run
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/ci-skip.js --workflow deploy.yml --head "${{ github.sha }}"
          --event "${{ github.event_name }}"
          --commit-message "${{ github.event.head_commit.message }}"

  check-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for AGENTS.md in changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            RANGE="$EMPTY_TREE..${{ github.sha }}"
          fi
          echo "Diff range: $RANGE"
          CHANGED=$(git diff --name-only "$RANGE" || git show --name-only --format= "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"
          echo "$CHANGED" | grep -qiE '(AGENTS\.md|AGENTS\.txt|AGENT\.md|AGENT\.txt|agent-readme\.md|RULES\.md)' && { echo "ERROR: AI rule files detected in changes. Blocking merge."; exit 1; } || echo "OK: No AI rule files detected."

  compat-node20:
    needs: [check-agents, preflight]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - run: npm ci
      - name: Tests (Node 20 LTS floor)
        run: npm test
      - name: Smoke build + installable app (Node 20 LTS floor)
        run: |
          npm run verify:config
          npm run verify:config-refs
          npm run verify:config-dupes
          npm run verify:internals
          npm run test:build
          npm run build

  build:
    needs: [check-agents, preflight]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Export internals to environment (SYNAPSE_OUT_DIR / PAGES_PROJECT / NODE_VERSION …)
        run: node scripts/ci-env.js
      - name: Full quality suite (aggregate, no early abort; report at build-artifacts/ci-checks.*)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-checks.js
      - name: Upload CI report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-checks
          path: build-artifacts/ci-checks.*
          if-no-files-found: error
      - name: Upload test artifacts (fuzz failures / web coverage / smoke / SBOM)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: build-artifacts/**
          if-no-files-found: ignore
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "CF_API_TOKEN not configured, skipping deploy"
            exit 0
          fi
          npm run deploy:pages

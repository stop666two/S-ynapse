name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --omit=dev --ignore-scripts
      - name: Decide whether to skip this run
        id: decide
        # 审查 R-04：提交信息与事件字段一律经 env 传入再引用。直接内插 ${{ }} 到 run: 脚本里
        # 等于让 PR 标题/正文（squash 合入后即提交信息）经 bash 解析执行——外部贡献者可控。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: >-
          node scripts/ci-skip.js --workflow deploy.yml --head "$HEAD_SHA"
          --event "$EVENT_NAME"
          --commit-message "$COMMIT_MESSAGE"

  check-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check for AGENTS.md in changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            RANGE="$EMPTY_TREE..${{ github.sha }}"
          fi
          echo "Diff range: $RANGE"
          CHANGED=$(git diff --name-only "$RANGE" || git show --name-only --format= "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"
          echo "$CHANGED" | grep -qiE '(AGENTS\.md|AGENTS\.txt|AGENT\.md|AGENT\.txt|agent-readme\.md|RULES\.md)' && { echo "ERROR: AI rule files detected in changes. Blocking merge."; exit 1; } || echo "OK: No AI rule files detected."

  compat-node20:
    needs: [check-agents, preflight]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - run: npm ci
      - name: Tests (Node 20 LTS floor)
        run: npm test
      - name: Smoke build + installable app (Node 20 LTS floor)
        run: |
          npm run verify:config
          npm run verify:config-refs
          npm run verify:config-single-source
          npm run verify:config-dupes
          npm run verify:internals
          npm run test:build
          npm run build

  build:
    needs: [check-agents, preflight]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 审查 R-38：本 job 跑聚合门禁（23 项 × internals.ci.checkTimeoutMs），最坏预算 ≈230min，
    # 此前没有显式 timeout，只能靠平台默认值；显式声明与 nightly 同口径。
    timeout-minutes: 260
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Export internals to environment (SYNAPSE_OUT_DIR / PAGES_PROJECT / NODE_VERSION …)
        run: node scripts/ci-env.js
      - name: Full quality suite (aggregate, no early abort; report at build-artifacts/ci-checks.*)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-checks.js
      - name: Upload CI report (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-checks
          path: build-artifacts/ci-checks.*
          if-no-files-found: error
      - name: Upload test artifacts (fuzz failures / web coverage / smoke / SBOM)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-artifacts
          path: build-artifacts/**
          if-no-files-found: ignore
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "CF_API_TOKEN not configured, skipping deploy"
            exit 0
          fi
          # 审查 R-06：Pages 只有构建期 _headers 的静态安全头，没有限流/路径拦截/维护模式/
          # HTTPS 跳转（见 docs/architecture.md §1.1）。生产域必须指向 Worker，Pages 仅预览。
          echo "NOTE: deploying to Cloudflare Pages (project: s-ynapse) — no rate limiting, path blocking, maintenance mode or HTTPS redirect on this surface."
          npm run deploy:pages

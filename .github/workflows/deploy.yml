name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for AGENTS.md in changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            RANGE="$EMPTY_TREE..${{ github.sha }}"
          fi
          echo "Diff range: $RANGE"
          CHANGED=$(git diff --name-only "$RANGE" || git show --name-only --format= "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"
          echo "$CHANGED" | grep -qiE '(AGENTS\.md|AGENTS\.txt|AGENT\.md|AGENT\.txt|agent-readme\.md|RULES\.md)' && { echo "ERROR: AI rule files detected in changes. Blocking merge."; exit 1; } || echo "OK: No AI rule files detected."

  compat-node20:
    needs: check-agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - run: npm ci
      - name: Tests (Node 20 LTS floor)
        run: npm test
      - name: Smoke build + installable app (Node 20 LTS floor)
        run: |
          npm run verify:config
          npm run verify:config-refs
          npm run verify:config-dupes
          npm run test:build
          npm run build

  build:
    needs: check-agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check (tsc checkJs, scripts/lib)
        run: npm run typecheck
      - run: npm test
      - name: Coverage gate (scripts/lib lines >= 80%)
        run: npm run test:coverage
      - run: npm run test:build
      - name: Fuzz property tests (deterministic seed + replay hints)
        run: npm run test:fuzz
      - name: Config consistency (code defaults vs config files)
        run: npm run verify:config
      - name: Config references (unwired key scan)
        run: npm run verify:config-refs
      - name: Config duplicates (same-object duplicate key scan)
        run: npm run verify:config-dupes
      - name: Config comments (per-key comment coverage guard)
        run: npm run verify:config-comments
      - name: Config docs coverage (config-reference key coverage)
        run: npm run verify:config-docs
      - name: Security verification (malicious-content build regression)
        run: npm run verify:security
      - run: npm run build
      - name: Web smoke (Chrome-only, skip-with-notice otherwise)
        run: |
          if [ -n "$CHROME_PATH" ] || command -v google-chrome >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1; then
            npm run test:smoke
          else
            echo "[SKIP] 未检测到 Chrome（CHROME_PATH/google-chrome/chromium），跳过浏览器冒烟"
          fi
      - name: Web coverage (headless JS lines/functions, Chrome-only)
        run: |
          if [ -n "$CHROME_PATH" ] || command -v google-chrome >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1; then
            npm run test:cov-web
          else
            echo "[SKIP] 未检测到 Chrome（CHROME_PATH/google-chrome/chromium），跳过 Web 覆盖率采集"
          fi
      - name: Headless compression verification (Chrome-only, skip-with-notice otherwise)
        run: |
          if [ -n "$CHROME_PATH" ] || command -v google-chrome >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1; then
            npm run verify:compression
          else
            echo "[SKIP] 未检测到 Chrome（CHROME_PATH/google-chrome/chromium），跳过压缩无头对比验证"
          fi
      - name: SBOM (CycloneDX 1.5 / ECMA-424)
        run: npm run sbom
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: build-artifacts/sbom.cdx.json
          if-no-files-found: error
      - name: Upload test artifacts (fuzz failures / web coverage / smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: build-artifacts/**
          if-no-files-found: ignore
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "CF_API_TOKEN not configured, skipping deploy"
            exit 0
          fi
          npx wrangler pages deploy dist --project-name=s-ynapse

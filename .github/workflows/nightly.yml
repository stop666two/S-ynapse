name: Nightly Deep Test

# 夜间深度随机测试：与本地/CI 同一聚合器（scripts/ci-checks.js），差异仅在深度档环境变量——
#   FC_NUM_RUNS=2000（属性测试迭代次数，本地/PR 默认 100）
#   STRESS=1（打开超大/海量用例）
#   不设 TEST_SEED：每夜抽取新随机种子，失败由留档 JSON 记录种子与重放命令。
on:
  schedule:
    # 每日 UTC 18:00（北京时间次日 02:00）
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --omit=dev --ignore-scripts
      - name: Decide whether to skip this run
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/ci-skip.js --workflow nightly.yml --head "${{ github.sha }}"
          --event "${{ github.event_name }}"

  deep:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 聚合器最坏预算 = 检查项数 × internals.ci.checkTimeoutMs（600000ms = 10min）+ 30min 缓冲，
    # 当前 24 项 → 270min（原先 120min 时慢夜会被平台杀掉，报告写入、ci/aggregate 状态与
    # if: always() 工件都来不及执行，恰好丢掉夜跑要留的种子与重放信息）。
    # verify:internals 会按 checkTimeoutMs × 检查项数反算并断言此处不得低于该预算；
    # 新增聚合检查时这一行要跟着抬（上限 360min）。
    timeout-minutes: 300
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Export internals to environment
        run: node scripts/ci-env.js
      - name: Deep randomized full suite (aggregate; FC_NUM_RUNS=2000, STRESS=1)
        env:
          FC_NUM_RUNS: '2000'
          STRESS: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-checks.js
      - name: Upload nightly artifacts (ci-checks / fuzz failures / web coverage / smoke)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-test-artifacts
          path: |
            build-artifacts/ci-checks.*
            build-artifacts/fuzz-failures/**
            build-artifacts/web-coverage/**
            build-artifacts/web-smoke/**
          if-no-files-found: ignore

name: Release Notes

# 手动补更 GitHub Release 描述（workflow_dispatch，输入目标 tag）：
#   - 生成器代码在默认分支 main，因此 checkout main 后再针对目标 tag 生成；
#   - 从目标 Release 下载 zip 附件用于计算 SHA-256（与 publish 作业同一生成器）；
#   - `gh release edit --notes-file` 只更新正文，不触碰 tag、标题、附件与 latest 标记。
# 适用场景：历史 Release 建成时描述过于简单（如仅一句 --notes），需要补全
# CHANGELOG 变更段、门禁清单、校验和与安装说明。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '目标 Release tag（如 v1.2.1）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch (release-notes generator lives here)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Normalize tag input
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          TAG="$(printf '%s' "$RAW_TAG" | sed -E 's/^[[:space:]]*(tag[[:space:]]*=)?[[:space:]]*//; s/[[:space:]]+$//')"
          test -n "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Validate target Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$TAG" --json tagName --jq .tagName
      # 改写公开正文前先校验 tag 内的 RELEASE.json（status/version/commit/checks）。
      # 生成器只会按真实 checks 渲染门禁状态，但「为不合规 tag 重写正文」本身就该被拒绝：
      # 不 verified 或门禁含非 true 时此步失败，后续 gh release edit 不会执行。
      - name: Validate RELEASE.json at target tag
        run: node scripts/lib/release-validate.js --tag "$TAG"
      - name: Download release archive asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG" -p '*.zip' --dir release-assets
      - name: Generate release notes
        run: node scripts/release-notes.js --tag "$TAG" --archive release-assets/S-ynapse-*.zip --out release-notes.md
      - name: Update release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --notes-file release-notes.md

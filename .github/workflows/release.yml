name: Release

# 仅由版本 tag 触发（正式版 vX.Y.Z 与预发布 vX.Y.Z-<预发布> 同样支持）：
#   validate    RELEASE.json 双重校验（status/version/tag/commit/checks）
#   gates       全套质量门禁（与 release:mark 的 RELEASE_GATES 同源）
#   archive     按白名单生成归档（articles/media 只保留 .gitkeep 骨架），并校验
#               RELEASE.json = package.json = tag 三方版本一致
#   buildability 解压归档 → npm ci --ignore-scripts → npm test → npm run build，
#               断言关键产物（失败即不发布）
#   publish     建 GitHub Release（始终 --latest，不按预发布标记）→ 清理其余 Release（只保留最新；tag 永不删除）
# 站点部署由 deploy.yml 独立负责（触发条件限定 branches: [main]），tag 推送不会触发部署。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate RELEASE.json at tag (status + version + commit + checks)
        run: node scripts/lib/release-validate.js --tag "$GITHUB_REF_NAME"

  gates:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check (tsc checkJs)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build smoke
        run: npm run test:build
      - name: Config consistency
        run: npm run verify:config
      - name: Config references
        run: npm run verify:config-refs
      - name: Config duplicates
        run: npm run verify:config-dupes
      - name: Config comments
        run: npm run verify:config-comments
      - name: Config docs
        run: npm run verify:config-docs
      - name: Internals consistency (.nvmrc / wrangler assets / CI versions)
        run: npm run verify:internals
      - name: Security verification
        run: npm run verify:security
      - name: Compression verification (Chrome-only, skip-with-notice otherwise)
        run: |
          if [ -n "$CHROME_PATH" ] || command -v google-chrome >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1; then
            npm run verify:compression
          else
            echo "[SKIP] 未检测到 Chrome（CHROME_PATH/google-chrome/chromium），跳过压缩无头对比验证（按既有条件策略）"
          fi
      - name: Real build
        run: npm run build

  archive:
    needs: [validate, gates]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build release archive (allowlist + version consistency assertions inside)
        run: node scripts/release-archive.js --ref "$GITHUB_REF_NAME"
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: release-artifacts/S-ynapse-*.zip
          if-no-files-found: error
          retention-days: 7

  buildability:
    needs: archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: release-archive
          path: release-archive
      - name: Extract archive
        run: |
          mkdir -p extracted
          unzip -q release-archive/S-ynapse-*.zip -d extracted
      - name: Fresh install from extracted archive
        run: |
          cd extracted/S-ynapse-*/
          npm ci --ignore-scripts
      - name: Run tests from extracted archive (empty-site skeleton)
        run: |
          cd extracted/S-ynapse-*/
          npm test
      - name: Build from extracted archive and assert key outputs
        run: |
          cd extracted/S-ynapse-*/
          npm run build
          test -f dist/index.html
          test -f dist/build-report.html
          # 搜索索引为每语言内容寻址产物（v2：/assets/search-index.<内容哈希>.json；旧固定路径
          # /{lang}/search-index.json 已在 v2 迁移中停止产出，见 docs/config-reference.md 搜索节）。
          # 空站（0 文章）同样必须为每个语言产出索引（空 docs 数组）与搜索页，否则 fail。
          shopt -s nullglob
          indexes=(dist/assets/search-index.*.json)
          langHomes=(dist/*/index.html)
          shopt -u nullglob
          langCount=${#langHomes[@]}
          if [ "$langCount" -lt 1 ]; then
            echo "[buildability] 未发现语言首页（dist/<lang>/index.html）"
            exit 1
          fi
          if [ "${#indexes[@]}" -lt "$langCount" ]; then
            echo "[buildability] 搜索索引数量不足：语言数 $langCount，dist/assets/search-index.<hash>.json 数 ${#indexes[@]}"
            exit 1
          fi
          for home in "${langHomes[@]}"; do
            test -f "$(dirname "$home")/search/index.html" || { echo "[buildability] 语言目录缺少搜索页：$home"; exit 1; }
          done
          echo "[buildability] 解压后 npm test 与 npm run build 通过：dist/index.html / dist/build-report.html / $langCount 种语言的搜索页与 assets/search-index.<hash>.json 均存在"

  publish:
    needs: [buildability]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: release-archive
          path: release-artifacts
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install runtime dependencies (prune script needs json5)
        run: npm ci --omit=dev
      - name: Generate release notes (CHANGELOG section + gates + archive SHA-256)
        run: node scripts/release-notes.js --tag "$GITHUB_REF_NAME" --archive release-artifacts/S-ynapse-*.zip --out release-notes.md
      - name: Create GitHub Release with archive asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/S-ynapse-*.zip \
            --verify-tag \
            --latest \
            --title "S-ynapse $GITHUB_REF_NAME" \
            --notes-file release-notes.md
      - name: Prune older releases (keep latest only; tags are never deleted)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-prune.js --keep "$GITHUB_REF_NAME"
